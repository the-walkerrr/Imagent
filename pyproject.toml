[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imagent"
description = "Local image indexing and search tool: private, offline, and cross-platform."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version", "dependencies"]

[project.scripts]
imagent = "imagent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "imagent.config.APP_VERSION" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imagent = ["prompts/*", "db/schema.sql", "image_processing/data/*.zip"]
