[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imagent"
description = "Local image indexing and search tool: private, offline, and cross-platform."
readme = "README.md"
requires-python = ">=3.9,<3.15"
dynamic = ["version"]
dependencies = [
    "pydantic>=2.0.0",
    "ollama>=0.6.0",
    "httpx>=0.27.0",
    "questionary>=2.0.0",
    "Pillow>=10.0.0",
    "pillow-heif>=1.0.0",
    "numpy>=1.24.0",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.16.0",
]

[project.scripts]
imagent = "imagent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "imagent.config.APP_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imagent = ["prompts/*", "db/schema.sql", "image_processing/data/*.zip"]
